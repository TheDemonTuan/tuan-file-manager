name: filemgr

services:
  app:
    image: ${FILEMGR_IMAGE:-filemgr:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${FILEMGR_DATA_DIR:-/srv/filemgr/data}
        target: /data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/app/filemgr", "healthcheck", "--url", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 60s
    pids_limit: 256
    env_file:
      - .env
    networks:
      panel-edge:
        aliases:
          - filemgr-app

networks:
  panel-edge:
    name: docker-panel_panel-edge
    external: true
